<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="AGOS — Bataan flood monitoring: rain forecasts with PAGASA-equivalent levels, flood map, evacuation centers and community reports.">
  <title>AGOS · Bataan flood monitoring</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app/css/agos.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    try { var s = localStorage.getItem("agos.theme"); if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" id="skipLink" href="#content">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/overview">
        <img class="brand-logo" src="app/img/agos-logo.png" alt="AGOS" width="618" height="215">
        <span class="brand-sub" id="brandSub">Bataan flood monitoring</span>
      </a>
      <nav class="nav" id="sideNav"></nav>
      <div class="sidebar-foot">
        <p class="disclaimer" id="sidebarDisclaimer"></p>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="brand-mobile" href="#/overview" aria-label="AGOS home">
          <img class="brand-logo" src="app/img/agos-logo.png" alt="" width="618" height="215">
        </a>
        <div class="topbar-title">
          <p id="pageTitle" class="topbar-h">AGOS</p>
          <p id="pageSub"></p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <main id="content" class="content" tabindex="-1">
        <div class="state" role="status"><div class="skeleton" style="width:50%"></div></div>
      </main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>

  <noscript><p style="padding:16px">AGOS needs JavaScript to load live data.</p></noscript>

  <!-- Backend address (js/config.js); must load before the app. -->
  <script src="js/config.js"></script>
  <script type="module" src="app/js/main.js"></script>
</body>
</html>
