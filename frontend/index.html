<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="AGOS — Bataan flood monitoring: rain forecasts with PAGASA-equivalent levels, flood map, evacuation centers and community reports.">

  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    try { var s = localStorage.getItem("agos.theme"); if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s); } catch (e) {}
  </script>
</head>

        </span>
        <span><span class="brand-name">AGOS</span><span class="brand-sub" id="brandSub">Bataan flood monitoring</span></span>

          <p id="pageSub"></p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <main id="content" class="content" tabindex="-1">
        <div class="state" role="status"><div class="skeleton" style="width:50%"></div></div>
      </main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>

  <!-- Backend address (js/config.js); must load before the app. -->
